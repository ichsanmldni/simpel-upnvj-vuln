services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: simpel_root_2024
      MYSQL_DATABASE: simpel
    ports:
      - "3307:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: db
      DATABASE_USER: root
      DATABASE_PASSWORD: simpel_root_2024
      DATABASE_NAME: simpel
    depends_on:
      - db
  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: simpel_root_2024
    ports:
      - "8081:80"
